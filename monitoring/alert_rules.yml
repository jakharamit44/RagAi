groups:
  - name: university_rag_alerts
    rules:
      - alert: HighQueryLatencyP95
        expr: histogram_quantile(0.95, sum(rate(rag_query_duration_seconds_bucket[5m])) by (le)) > 5.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAG Query P95 latency exceeds 5 seconds"
          description: "P95 query latency is currently {{ $value }}s on {{ $labels.instance }}."

      - alert: HighErrorRate
        expr: sum(rate(rag_query_total{status="error"}[5m])) / sum(rate(rag_query_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RAG query error rate exceeds 5%"
          description: "High error rate detected in university QA queries."

      - alert: LowCacheHitRatio
        expr: sum(rate(rag_cache_hits_total[15m])) / (sum(rate(rag_cache_hits_total[15m])) + sum(rate(rag_cache_misses_total[15m]))) < 0.20
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Semantic cache hit ratio below 20%"
          description: "Cache efficiency degraded, increasing local LLM compute load."
