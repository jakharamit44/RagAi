[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "university-rag-system"
version = "0.1.0"
description = "Enterprise Local-First RAG System for University Students"
authors = [
    { name = "University IT Engineering Team" }
]
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "qdrant-client>=1.11.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "watchdog>=5.0.0",
    "sentence-transformers>=3.1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
