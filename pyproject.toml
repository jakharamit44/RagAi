[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragai-platform"
version = "2.4.0"
description = "Enterprise Local-First Cognitive RAG and AI Brain Platform for University & Enterprise"
authors = [
    { name = "University Engineering Team" }
]
readme = "USER_MANUAL.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "qdrant-client>=1.11.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "watchdog>=5.0.0",
    "sentence-transformers>=3.1.0",
    "transformers>=4.44.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "httpx>=0.27.2",
    "requests>=2.32.3",
    "pyjwt>=2.9.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
