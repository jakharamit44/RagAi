apiVersion: v1
kind: Service
metadata:
  name: university-rag-api-svc
  namespace: university-rag
  labels:
    app: university-rag-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: university-rag-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: university-rag-ingress
  namespace: university-rag
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/limit-rps: "60"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: university-rag-api-svc
                port:
                  number: 8000
