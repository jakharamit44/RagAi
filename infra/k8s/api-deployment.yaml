apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-rag-api
  labels:
    app: university-rag-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: university-rag-api
  template:
    metadata:
      labels:
        app: university-rag-api
    spec:
      containers:
        - name: api
          image: university-rag-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: university-rag-api-svc
spec:
  selector:
    app: university-rag-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
