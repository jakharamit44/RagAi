apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: university-rag-api-hpa
  namespace: university-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: university-rag-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
