apiVersion: v1
kind: Secret
metadata:
  name: university-rag-secrets
  namespace: university-rag
type: Opaque
# Production Secret Template - Inject values via SealedSecrets, Vault, or CI/CD pipelines
stringData:
  DATABASE_URL: "${DATABASE_URL}"
  JWT_SIGNING_KEY: "${JWT_SIGNING_KEY}"
  API_KEY: "${API_KEY}"
