version: '3.8'

services:
  # Relational DB (Manifest, documents, chunks, users, audit)
  postgres:
    image: postgres:16-alpine
    container_name: university_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-university_rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vector Database
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: university_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: university_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Message Broker for Async Ingestion
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: university_rag_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # Local Development LLM Engine (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: university_rag_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # Core API Service
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: university_rag_api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/university_rag
      VECTOR_STORE_HOST: qdrant
      VECTOR_STORE_PORT: 6333
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  # Celery Async Worker
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: university_rag_worker
    restart: unless-stopped
    command: celery -A workers.celery_app worker --loglevel=info -c 4
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/university_rag
      VECTOR_STORE_HOST: qdrant
      VECTOR_STORE_PORT: 6333
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      - postgres
      - rabbitmq
      - redis

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  ollama_models:
