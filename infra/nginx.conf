events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # Rate limiting zones (Phase 19)
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=60r/m;
    limit_req_zone $http_authorization zone=student_limit:10m rate=20r/m;

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        location / {
            limit_req zone=ip_limit burst=10 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming support for SSE
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://api_backend/health;
            access_log off;
        }
    }
}
